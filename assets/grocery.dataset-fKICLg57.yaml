flows:
  - id: browse-catalog
    name: Browse the catalog
    trigger: A customer opens a category in the web shop.
    steps:
      - type: interaction
        id: ask
        interactionId: web-browses-products
        leg: request
      - type: interaction
        id: route
        interactionId: gateway-routes-products
      - type: interaction
        id: read
        interactionId: catalog-reads-products
      - type: interaction
        id: show
        interactionId: web-browses-products
        leg: response
      - type: end
        id: shown
        outcome: success
  - id: place-order
    name: Place an order
    description: A customer pays for the basket; stock is reserved first and released if the card is declined.
    trigger: The customer chooses Pay in the web shop or the app.
    phases:
      - id: order
        name: Order request
        description: The shop sends the basket, and the gateway passes it to the order service.
        startStepId: send-basket
      - id: stock
        name: Stock reservation
        description: The warehouse holds the products, or the customer learns which one is missing.
        startStepId: reserve-stock
      - id: payment
        name: Payment
        description: The card is charged; when it is declined, the reservation is released.
        startStepId: charge-card
      - id: fulfilment
        name: Fulfilment
        description: The order is stored and announced; the warehouse prepares it and the customer gets a confirmation.
        startStepId: store-order
    steps:
      - type: interaction
        id: send-basket
        interactionId: web-places-order
        leg: request
        description: The web shop sends the basket and a card token.
      - type: interaction
        id: route-order
        interactionId: gateway-routes-orders
      - type: interaction
        id: reserve-stock
        interactionId: orders-reserve-stock
        description: The order service asks the warehouse to hold the products.
      - type: choice
        id: in-stock
        branches:
          - condition: A product is out of stock
            steps:
              - type: interaction
                id: tell-out-of-stock
                interactionId: web-places-order
                leg: response
                description: The customer sees which product is missing.
              - type: end
                id: out-of-stock
                outcome: failure
          - condition: Everything is in stock
            steps:
              - type: interaction
                id: charge-card
                interactionId: orders-charge-card
                description: The payment provider charges the card.
              - type: choice
                id: payment
                branches:
                  - condition: The card is declined
                    steps:
                      - type: interaction
                        id: release-stock
                        interactionId: orders-release-stock
                        description: The reservation is released.
                      - type: end
                        id: declined
                        outcome: failure
                  - condition: The card is charged
                    steps:
                      - type: interaction
                        id: store-order
                        interactionId: orders-store-order
                      - type: interaction
                        id: announce
                        interactionId: orders-publish-placed
                        asyncBoundary: true
                      - type: parallel
                        id: after-placing
                        branches:
                          - steps:
                              - type: interaction
                                id: commit-stock
                                interactionId: inventory-receives-placed
                                description: The warehouse turns the reservation into a pick list.
                          - steps:
                              - type: interaction
                                id: notify
                                interactionId: notification-receives-placed
                                description: The customer gets an order confirmation.
                                environmentIds:
                                  - production
                      - type: interaction
                        id: confirm-order
                        interactionId: web-places-order
                        leg: response
                      - type: end
                        id: placed
                        outcome: success
documents:
  - id: catalog-openapi
    name: Catalog API
    format: openapi
    formatVersion: 3.1.0
    documentVersion: 2.0.0
    mediaType: application/yaml
    content: |
      openapi: 3.1.0
      info:
        title: Catalog API
        version: 2.0.0
        description: Products and categories of the grocery store. Fictional; part of the DomainMap demos.
      paths:
        /products:
          get:
            operationId: listProducts
            summary: List the products of a category
            parameters:
              - name: categoryId
                in: query
                required: false
                schema: { type: integer }
            responses:
              '200':
                description: The products.
                content:
                  application/json:
                    schema:
                      type: array
                      items: { $ref: '#/components/schemas/Product' }
        /products/{sku}:
          get:
            operationId: getProduct
            summary: Get one product
            parameters:
              - name: sku
                in: path
                required: true
                schema: { type: string }
            responses:
              '200':
                description: The product.
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Product' }
              '404':
                description: No such product.
      components:
        schemas:
          Product:
            type: object
            required: [sku, name, priceCents]
            properties:
              sku: { type: string }
              name: { type: string }
              categoryId: { type: integer }
              priceCents: { type: integer, minimum: 0 }
  - id: inventory-grpc
    name: Inventory API (gRPC)
    format: protobuf
    documentVersion: v1
    mediaType: text/plain
    content: |
      // Fictional; part of the DomainMap demos.
      syntax = "proto3";

      package grocery.inventory.v1;

      // Used by the order service to hold and release stock for an order.
      service Inventory {
        // Holds the products of an order; fails when one is out of stock.
        rpc ReserveItems(ReserveItemsRequest) returns (Reservation);
        // Releases a hold, for example after a declined card.
        rpc ReleaseItems(ReleaseItemsRequest) returns (Reservation);
      }

      message Item {
        string sku = 1;
        int32 quantity = 2;
      }

      message ReserveItemsRequest {
        string order_id = 1;
        repeated Item items = 2;
      }

      message ReleaseItemsRequest {
        string reservation_id = 1;
      }

      message Reservation {
        string reservation_id = 1;
        repeated Item held = 2;
      }
  - id: orders-openapi
    name: Orders API
    format: openapi
    formatVersion: 3.1.0
    documentVersion: 1.4.0
    mediaType: application/yaml
    content: |
      openapi: 3.1.0
      info:
        title: Orders API
        version: 1.4.0
        description: Placing and tracking grocery orders. Fictional; part of the DomainMap demos.
      paths:
        /orders:
          post:
            operationId: placeOrder
            summary: Place an order and pay for it
            parameters:
              - name: Idempotency-Key
                in: header
                required: true
                schema: { type: string }
            requestBody:
              required: true
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/Basket' }
            responses:
              '201':
                description: Placed and paid.
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Order' }
              '402':
                description: The card was declined.
              '409':
                description: A product is out of stock.
        /orders/{orderId}:
          get:
            operationId: getOrder
            summary: Track an order
            parameters:
              - name: orderId
                in: path
                required: true
                schema: { type: string, format: uuid }
            responses:
              '200':
                description: The order and its status.
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Order' }
      components:
        schemas:
          Basket:
            type: object
            required: [lines, cardToken]
            properties:
              cardToken: { type: string }
              lines:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/Line' }
          Line:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
          Order:
            type: object
            required: [orderId, status, totalCents]
            properties:
              orderId: { type: string, format: uuid }
              status: { type: string, enum: [placed, picked, delivered, cancelled] }
              totalCents: { type: integer }
              lines:
                type: array
                items: { $ref: '#/components/schemas/Line' }
  - id: order-events-asyncapi
    name: Order events
    format: asyncapi
    formatVersion: 3.0.0
    documentVersion: 1.1.0
    mediaType: application/yaml
    content: |
      asyncapi: 3.0.0
      info:
        title: Order events
        version: 1.1.0
        description: >-
          Orders announced on the event bus once they are paid. Fictional; part of the DomainMap
          demos.
      channels:
        orderEvents:
          address: order-events
          messages:
            orderPlaced:
              $ref: '#/components/messages/orderPlaced'
      operations:
        publishOrderPlaced:
          action: send
          channel:
            $ref: '#/channels/orderEvents'
          messages:
            - $ref: '#/channels/orderEvents/messages/orderPlaced'
        receiveOrderPlaced:
          action: receive
          channel:
            $ref: '#/channels/orderEvents'
          messages:
            - $ref: '#/channels/orderEvents/messages/orderPlaced'
      components:
        messages:
          orderPlaced:
            summary: An order was paid and is ready to be picked.
            payload:
              type: object
              required: [orderId, lines, placedAt]
              properties:
                orderId:
                  type: string
                  format: uuid
                placedAt:
                  type: string
                  format: date-time
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku:
                        type: string
                      quantity:
                        type: integer
