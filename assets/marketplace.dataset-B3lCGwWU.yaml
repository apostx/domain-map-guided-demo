# Generated by "npm run generate:marketplace" from packages/generator/src/marketplace.ts. Do not edit; edit the generator instead.
specVersion: "0.6"
dataset:
  id: marketplace-demo
  name: Online marketplace (demo)
  description: A fictional online marketplace where many sellers sell to customers on the web and in mobile apps. Eleven domains, from the storefront and the catalog to payments, fulfilment and shipping, talk over APIs and an event bus; most of it runs in one cloud account, the warehouses on premises. Large enough to show how the viewer copes with a couple of hundred components.
  revision: 2026-10-20
  generator:
    name: domain-map marketplace generator
glossary:
  - id: term-seller
    term: Seller
    definition: A business that sells its products on the marketplace.
    relatedIds:
      - seller-service
  - id: term-listing
    term: Listing
    definition: "A seller's offer of a product: price, stock and delivery."
    relatedIds:
      - listing-service
  - id: term-sku
    term: SKU
    definition: The code of one variant of a product, such as a size and colour.
    relatedIds:
      - product-service
  - id: term-basket
    term: Basket
    definition: What a customer means to buy, before checkout.
    relatedIds:
      - basket-service
  - id: term-order
    term: Order
    definition: A paid basket; split into one part per seller and warehouse.
    relatedIds:
      - order-service
  - id: term-parcel
    term: Parcel
    definition: One box that leaves a warehouse with a carrier.
    relatedIds:
      - shipment-service
  - id: term-payout
    term: Payout
    definition: Money the marketplace pays a seller for their sales.
    relatedIds:
      - payout-service
  - id: term-commission
    term: Commission
    definition: The marketplace's share of each sale.
    relatedIds:
      - commission-service
