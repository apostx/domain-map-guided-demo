flows:
  - id: place-order
    name: Place an order
    trigger: A customer places the order in their basket.
    phases:
      - id: browse
        name: Browse
        description: The customer looks at a product and its price.
        startStepId: open-product-page
      - id: basket
        name: Basket and checkout
        description: The product goes into the basket, and the customer checks out.
        startStepId: add-to-basket
      - id: payment
        name: Payment
        description: Stock is held and the card is authorized.
        startStepId: reserve-stock
      - id: confirmation
        name: Confirmation
        description: The order is created and everyone who needs it hears about it.
        startStepId: create-order
    steps:
      - type: interaction
        id: open-product-page
        interactionId: web-shop-get-product-page-storefront-gateway
        description: The customer opens a product.
      - type: interaction
        id: compose-product-page
        interactionId: storefront-gateway-get-product-page-storefront-api
        description: The gateway asks the storefront API for the page.
      - type: interaction
        id: get-product
        interactionId: storefront-api-get-product-product-service
        description: The page shows the product and its variants.
      - type: interaction
        id: get-price
        interactionId: storefront-api-get-price-price-service
        description: The page shows the customer's price.
      - type: interaction
        id: add-to-basket
        interactionId: storefront-api-add-item-basket-service
        description: The customer puts the product in the basket.
      - type: interaction
        id: start-checkout
        interactionId: storefront-api-start-checkout-checkout-service
        description: The customer checks out.
      - type: interaction
        id: get-delivery-options
        interactionId: checkout-service-get-delivery-options-delivery-option-service
        description: The customer chooses how the order is delivered.
      - type: interaction
        id: calculate-tax
        interactionId: checkout-service-calculate-tax-tax-service
        description: Taxes are added to the total.
      - type: interaction
        id: reserve-stock
        interactionId: checkout-service-reserve-stock-stock-service
        description: The stock is held for the order.
      - type: interaction
        id: authorize-payment
        interactionId: checkout-service-authorize-payment-payment-service
        description: The checkout asks for the payment.
      - type: interaction
        id: authorize-card
        interactionId: payment-service-authorize-card-payment-card-network
        description: The card network authorizes the card.
      - type: choice
        id: card-decision
        branches:
          - condition: The card is declined
            steps:
              - type: interaction
                id: release-stock
                interactionId: checkout-service-release-stock-stock-service
                description: The held stock goes back on sale.
              - type: action
                id: ask-for-another-card
                componentId: checkout-service
                description: Asks the customer for another way to pay.
              - type: end
                id: payment-declined
                outcome: failure
          - condition: The card is authorized
            steps:
              - type: interaction
                id: create-order
                interactionId: checkout-service-create-order-order-service
                description: The order is created.
              - type: interaction
                id: announce-order
                interactionId: order-service-publish-order-placed-order-events
                description: The order service announces the order.
              - type: interaction
                id: plan-fulfilment
                interactionId: order-events-receive-order-placed-fulfilment-planner
                description: Fulfilment hears of the order and plans it.
              - type: interaction
                id: confirm-to-customer
                interactionId: order-events-receive-order-placed-notification-service
                description: Notifications hear of the order.
              - type: interaction
                id: send-confirmation
                interactionId: notification-service-send-email-email-provider
                description: The customer gets a confirmation by email.
              - type: end
                id: order-placed
                outcome: success
  - id: ship-order
    name: Ship an order
    trigger: Fulfilment has planned an order.
    phases:
      - id: pick-and-pack
        name: Pick and pack
        description: The warehouse picks the items and packs the parcel.
        startStepId: create-pick-list
      - id: hand-over
        name: Hand over
        description: A carrier is chosen and booked.
        startStepId: select-carrier
      - id: track
        name: Track
        description: The parcel is followed until it is delivered.
        startStepId: poll-tracking
    steps:
      - type: interaction
        id: create-pick-list
        interactionId: fulfilment-planner-create-pick-list-warehouse-service
        description: The planner sends the order lines to the warehouse.
      - type: interaction
        id: find-slot
        interactionId: warehouse-service-get-slot-slotting-service
        description: The warehouse finds where each item is kept.
      - type: interaction
        id: choose-box
        interactionId: warehouse-service-choose-box-packaging-service
        description: The right box is chosen.
      - type: action
        id: pack-parcel
        componentId: warehouse-service
        description: Records the parcel as packed.
      - type: interaction
        id: announce-packed
        interactionId: warehouse-service-publish-parcel-packed-fulfilment-events
        description: The warehouse announces the parcel.
      - type: interaction
        id: hear-packed
        interactionId: fulfilment-events-receive-parcel-packed-shipment-service
        description: Shipping hears of the parcel.
      - type: interaction
        id: select-carrier
        interactionId: shipment-service-select-carrier-carrier-selection-service
        description: The carrier is chosen by size and destination.
      - type: interaction
        id: book-pickup
        interactionId: shipment-service-book-carrier-pickup-parcel-carrier
        description: The carrier is booked to collect the parcel.
      - type: interaction
        id: create-label
        interactionId: shipment-service-create-label-label-service
        description: The label is printed.
      - type: interaction
        id: poll-tracking
        interactionId: tracking-service-fetch-tracking-events-parcel-carrier
        description: Tracking asks the carrier for news.
      - type: interaction
        id: announce-delivered
        interactionId: tracking-service-publish-parcel-delivered-shipment-events
        description: Tracking announces the delivery.
      - type: interaction
        id: tell-customer
        interactionId: shipment-events-receive-parcel-delivered-notification-service
        description: The customer is told the parcel arrived.
      - type: end
        id: parcel-delivered
        outcome: success
  - id: list-product
    name: A seller lists a product
    trigger: A seller puts a new product up for sale in the seller portal.
    phases:
      - id: describe
        name: Describe
        description: The seller describes the product.
        startStepId: create-listing
      - id: check
        name: Check
        description: The catalog checks that the product is complete.
        startStepId: validate-product
      - id: publish
        name: Publish
        description: The product goes on sale and becomes searchable.
        startStepId: announce-listing
    steps:
      - type: interaction
        id: create-listing
        interactionId: seller-portal-create-listing-listing-service
        description: The seller enters the product.
      - type: interaction
        id: create-product
        interactionId: listing-service-create-product-product-service
        description: The listing creates the product in the catalog.
      - type: interaction
        id: upload-media
        interactionId: seller-portal-upload-media-media-service
        description: The seller adds photos.
      - type: interaction
        id: validate-product
        interactionId: product-service-validate-product-product-validation-service
        description: The product is checked for completeness.
      - type: interaction
        id: set-price
        interactionId: listing-service-update-price-price-service
        description: The seller's price is set.
      - type: interaction
        id: announce-listing
        interactionId: listing-service-publish-listing-published-seller-events
        description: The listing is announced.
      - type: interaction
        id: announce-product
        interactionId: product-service-publish-product-changed-product-events
        description: The catalog announces the new product.
      - type: interaction
        id: index-product
        interactionId: product-events-receive-product-changed-indexing-service
        description: Search indexes the product.
      - type: end
        id: product-listed
        outcome: success
  - id: search-products
    name: Search for products
    trigger: A customer types in the search box of the app.
    steps:
      - type: interaction
        id: suggest
        interactionId: android-app-get-suggestions-storefront-gateway
        description: The app suggests words as the customer types.
      - type: interaction
        id: search
        interactionId: storefront-api-search-products-search-service
        description: The customer searches.
      - type: interaction
        id: rank
        interactionId: search-service-rank-products-ranking-service
        description: The results are ordered.
      - type: interaction
        id: price-results
        interactionId: search-service-list-prices-price-service
        description: The results show current prices.
      - type: end
        id: results-shown
        outcome: success
