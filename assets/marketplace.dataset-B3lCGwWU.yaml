  - id: search
    name: Search
    description: Finding products by words, filters and categories.
  - id: pricing
    name: Pricing
    description: Prices, promotions, vouchers and the taxes on them.
  - id: checkout
    name: Checkout
    description: Baskets, delivery options and placing an order.
  - id: orders
    name: Orders
    description: Orders from placement to completion, with their changes and cancellations.
  - id: payments
    name: Payments
    description: Taking payments, refunds and checking them for fraud.
  - id: fulfilment
    name: Fulfilment
    description: Stock, warehouses, picking and packing orders.
  - id: shipping
    name: Shipping
    description: Sending parcels with carriers and following them to the door.
  - id: customers
    name: Customers
    description: Customer accounts, addresses, sign-in and the messages customers get.
  - id: sellers
    name: Sellers
    description: "The sellers who sell on the marketplace: their shops, products, payouts and reports."
  - id: customer-care
    name: Customer care
    description: "Helping customers who write, chat or call: tickets, chats and the help center."
