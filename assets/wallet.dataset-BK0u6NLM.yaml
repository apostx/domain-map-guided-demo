                type: string
              currency:
                type: string
              cardToken:
                type: string
              idempotencyKey:
                type: string
          TransferCommand:
            type: object
            required: [customerId, fromWalletId, toWalletId, amount, currency, idempotencyKey]
            properties:
              customerId:
                type: string
              fromWalletId:
                type: string
              toWalletId:
                type: string
              amount:
                type: string
              currency:
                type: string
              quoteId:
                type: string
              idempotencyKey:
                type: string
          PaymentResultCommand:
            type: object
            required: [eventId, providerReference, outcome]
            properties:
              eventId:
                type: string
              providerReference:
                type: string
              outcome:
                type: string
                enum: [approved, declined]
