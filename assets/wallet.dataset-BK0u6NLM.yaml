flows:
  - id: top-up
    name: Add money from a card
    description: A customer tops up a wallet from a card. The card charge is confirmed later by the provider's callback, which can be delayed and can arrive more than once.
    trigger: The customer confirms a top-up in the web wallet.
    phases:
      - id: request
        name: Customer request
        description: The customer asks for the top-up; the gateway checks access and passes it on.
        startStepId: request-top-up
      - id: risk
        name: Risk check
        description: The risk service decides whether the top-up may go ahead.
        startStepId: assess-risk
      - id: payment
        name: Payment initiation
        description: The top-up is stored as pending and the provider is asked to charge the card; the customer sees it as pending at once.
        startStepId: store-pending
      - id: callback
        name: Provider callback
        description: The provider reports the result later, or not at all within the time allowed.
        startStepId: await-payment-result
      - id: result
        name: Apply the result
        description: Duplicate results are ignored, a declined payment fails the top-up, and an approved one credits the wallet exactly once.
        startStepId: duplicate-check
      - id: completion
        name: Completion
        description: Bookkeeping and the customer's notification run side by side.
        startStepId: after-credit
    steps:
      - type: interaction
        id: request-top-up
        interactionId: web-wallet-starts-top-up
        leg: request
        description: The web wallet sends the amount and a card token.
      - type: interaction
        id: check-token
        interactionId: gateway-checks-token
        description: The gateway checks the customer's access token.
      - type: interaction
        id: route-top-up
        interactionId: gateway-routes-top-up
        description: The gateway passes the request to the transfer service.
      - type: interaction
        id: assess-risk
        interactionId: transfer-asks-risk
        description: The risk service approves or rejects the top-up.
      - type: choice
        id: risk-decision
        branches:
          - condition: Rejected by risk rules
            steps:
              - type: action
                id: reject-top-up
                componentId: transfer-service
                description: Records the top-up as rejected, with the reason.
              - type: interaction
                id: report-rejection
                interactionId: web-wallet-starts-top-up
                leg: response
                description: The customer sees why the top-up was rejected.
              - type: end
                id: top-up-rejected
                outcome: failure
          - condition: Approved
            steps:
              - type: interaction
                id: store-pending
                interactionId: transfer-stores-records
                description: Stores the top-up as pending.
              - type: interaction
                id: charge-sandbox
                interactionId: transfer-charges-sandbox
                description: Asks the payment sandbox to charge a test card.
                environmentIds:
                  - staging
              - type: interaction
                id: charge-card
                interactionId: transfer-charges-card
                description: Asks the payment provider to charge the card.
                environmentIds:
                  - production
                retry:
                  maxAttempts: 3
                  backoff: exponential, starting at 1 second
                onFailure:
                  description: The provider stays unreachable.
                  steps:
                    - type: action
                      id: mark-charge-failed
                      componentId: transfer-service
                      description: Marks the top-up as failed.
                    - type: end
                      id: charge-unavailable
                      outcome: failure
              - type: interaction
                id: confirm-pending
                interactionId: web-wallet-starts-top-up
                leg: response
                asyncBoundary: true
                description: The customer sees the top-up as pending; the rest happens in the background.
              - type: wait
                id: await-payment-result
                description: Waits for the provider's callback, which can take several minutes.
                timeout: 30 minutes
                onFailure:
                  description: No callback arrives in time.
                  steps:
                    - type: action
                      id: escalate-missing-callback
                      componentId: transfer-service
                      description: Keeps the top-up pending and flags it for reconciliation.
                    - type: end
                      id: callback-missing
                      outcome: failure
              - type: interaction
                id: receive-callback
                interactionId: provider-reports-payment
                description: The provider reports the result to the public API.
                environmentIds:
                  - production
              - type: interaction
                id: receive-sandbox-callback
                interactionId: sandbox-reports-payment
                description: The sandbox reports the result to the public API.
                environmentIds:
                  - staging
              - type: interaction
                id: forward-callback
                interactionId: gateway-forwards-payment-result
                description: The gateway forwards the result to the transfer service.
              - type: choice
                id: duplicate-check
                description: Results are identified by their eventId.
                branches:
                  - condition: The eventId was already processed (duplicate callback)
                    steps:
                      - type: action
                        id: ignore-duplicate
                        componentId: transfer-service
                        description: Ignores the duplicate and answers as if it were new.
                      - type: end
                        id: duplicate-ignored
                        outcome: success
                  - condition: Payment declined
                    steps:
                      - type: action
                        id: mark-declined
                        componentId: transfer-service
                        description: Marks the top-up as failed.
                      - type: interaction
                        id: announce-declined
                        interactionId: transfer-publishes-status
                        description: Publishes the failed status.
                      - type: end
                        id: top-up-declined
                        outcome: failure
                  - condition: Payment approved
                    steps:
                      - type: interaction
                        id: credit-wallet
                        interactionId: transfer-applies-balance-change
                        description: Credits the wallet exactly once.
                      - type: parallel
                        id: after-credit
                        branches:
                          - name: Bookkeeping
                            steps:
                              - type: interaction
                                id: send-postings
                                interactionId: transfer-sends-postings
                                asyncBoundary: true
                                description: Sends a balanced journal entry to the ledger.
                              - type: subflow
                                id: book-entry
                                flowId: book-journal-entry
                          - name: Customer notification
                            steps:
                              - type: interaction
                                id: announce-completed
                                interactionId: transfer-publishes-status
                                description: Publishes the completed status.
                              - type: interaction
                                id: notify-customer
                                interactionId: notification-receives-status
                                description: The notification function e-mails the customer.
                      - type: end
                        id: top-up-completed
                        outcome: success
  - id: transfer
    name: Send money with currency conversion
    description: A customer sends money from a wallet in one currency to a wallet in another.
    trigger: The customer confirms a transfer in the web wallet.
    phases:
      - id: quote
        name: Quote
        description: The customer asks for an exchange rate and gets a quote that holds for a while.
        startStepId: request-quote
      - id: request
        name: Transfer request
        description: The customer confirms the transfer, and the gateway passes it on.
        startStepId: request-transfer
      - id: risk
        name: Risk check
        description: The risk service decides whether the transfer may go ahead.
        startStepId: assess-transfer-risk
      - id: move
        name: Money movement
        description: The quote must still hold and the funds must be there; then the money moves between the wallets.
        startStepId: confirm-quote
      - id: completion
        name: Completion
        description: Bookkeeping and the announcement run side by side; then the customer sees it.
        startStepId: after-transfer
    steps:
      - type: interaction
        id: request-quote
        interactionId: web-wallet-requests-quote
        description: The web wallet asks for an exchange quote.
      - type: interaction
        id: issue-quote
        interactionId: gateway-routes-quote
        description: The quote service returns a rate that is valid for 30 seconds.
      - type: interaction
        id: request-transfer
        interactionId: web-wallet-starts-transfer
        leg: request
        description: The customer accepts the quote and starts the transfer.
      - type: interaction
        id: route-transfer
        interactionId: gateway-routes-transfer
      - type: interaction
        id: assess-transfer-risk
        interactionId: transfer-asks-risk
      - type: choice
        id: transfer-risk-decision
        branches:
          - condition: Rejected by risk rules
            steps:
              - type: interaction
                id: report-transfer-rejection
                interactionId: web-wallet-starts-transfer
                leg: response
                description: The customer sees that the transfer was rejected.
              - type: end
                id: transfer-rejected
                outcome: failure
          - condition: Approved
            steps:
              - type: interaction
                id: confirm-quote
                interactionId: transfer-confirms-quote
                description: Uses the quote; fails when it expired or was already used.
                onFailure:
                  description: The quote expired.
                  steps:
                    - type: end
                      id: quote-expired
                      outcome: failure
              - type: interaction
                id: reserve-funds
                interactionId: transfer-reserves-funds
                description: Reserves the amount in the sending wallet.
                onFailure:
                  description: Not enough money in the wallet.
                  steps:
                    - type: end
                      id: insufficient-funds
                      outcome: failure
              - type: interaction
                id: move-money
                interactionId: transfer-applies-balance-change
                description: Debits the sending wallet and credits the receiving one.
              - type: parallel
                id: after-transfer
                branches:
                  - name: Bookkeeping
                    steps:
                      - type: interaction
                        id: send-transfer-postings
                        interactionId: transfer-sends-postings
                        asyncBoundary: true
                        description: Sends one entry with an EUR and a USD part, each balanced.
                      - type: subflow
                        id: book-transfer-entry
                        flowId: book-journal-entry
                  - name: Customer notification
                    steps:
                      - type: interaction
                        id: announce-transfer
                        interactionId: transfer-publishes-status
              - type: interaction
                id: report-transfer-result
                interactionId: web-wallet-starts-transfer
                leg: response
              - type: end
                id: transfer-completed
                outcome: success
  - id: refund
    name: Refund a top-up
    trigger: Customer support approves a refund.
    environmentIds:
      - production
    steps:
      - type: action
        id: receive-refund-request
        componentId: transfer-service
        description: Receives the approved refund from the support tools (not described here).
      - type: interaction
        id: request-refund
        interactionId: transfer-refunds-card
        description: Asks the provider to refund the card.
        retry:
          maxAttempts: 5
          backoff: exponential, starting at 2 seconds
      - type: wait
        id: await-refund-result
        description: Waits for the provider's callback.
        timeout: 1 day
      - type: interaction
        id: receive-refund-callback
        interactionId: provider-reports-payment
      - type: interaction
        id: forward-refund-callback
        interactionId: gateway-forwards-payment-result
      - type: interaction
        id: debit-wallet
        interactionId: transfer-applies-balance-change
        description: Debits the refunded amount from the wallet.
      - type: interaction
        id: send-refund-postings
        interactionId: transfer-sends-postings
        asyncBoundary: true
      - type: subflow
        id: book-refund-entry
        flowId: book-journal-entry
      - type: end
        id: refund-completed
        outcome: success
  - id: book-journal-entry
    name: Book a journal entry
    description: How the ledger books a posting request; used by the other flows.
    trigger: A posting request arrives on the ledger postings topic.
    steps:
      - type: interaction
        id: receive-posting
        interactionId: ledger-receives-postings
        description: The ledger receives the request; redelivery is possible.
      - type: action
        id: check-balance
        componentId: ledger-service
        description: Checks that debits equal credits for every currency and that the idempotency key is new.
      - type: interaction
        id: write-entry
        interactionId: ledger-writes-journal
        description: Writes the journal entry and its postings in one database transaction.
      - type: end
        id: entry-booked
        outcome: success
  - id: nightly-reconciliation
    name: Reconcile the settlement file
    trigger: Every night at 02:00.
    environmentIds:
      - production
    steps:
      - type: interaction
        id: download-file
        interactionId: reconciliation-downloads-settlement
        description: Downloads yesterday's settlement file.
        retry:
          maxAttempts: 5
          backoff: every 10 minutes
        onFailure:
          description: The file is still missing.
          steps:
            - type: action
              id: alert-operations
              componentId: reconciliation-job
              description: Alerts the operations team.
            - type: end
              id: file-missing
              outcome: failure
      - type: interaction
        id: read-journal
        interactionId: reconciliation-reads-journal
      - type: action
        id: match-lines
        componentId: reconciliation-job
        description: Matches settlement lines with journal entries by movement ID.
      - type: choice
        id: differences
        branches:
          - condition: Everything matches
            steps:
              - type: end
                id: reconciled
                outcome: success
          - condition: Differences found
            steps:
              - type: interaction
                id: book-corrections
                interactionId: reconciliation-books-corrections
                description: Books a balanced correction for each difference.
              - type: interaction
                id: write-corrections
                interactionId: ledger-writes-journal
              - type: end
                id: corrected
                outcome: success
documents:
  - id: public-api-openapi
    name: Wallet public API
    format: openapi
    formatVersion: 3.1.0
    documentVersion: 2.4.0
    mediaType: application/yaml
    sourceId: wallet-platform-head
    content: |
      openapi: 3.1.0
      info:
        title: Wallet public API
        version: 2.4.0
        description: >-
          The API that the web wallet and the payment provider use, exposed by the API gateway.
          Fictional; part of the DomainMap demo.
      paths:
        /sessions:
          post:
            operationId: signIn
            summary: Sign in and receive an access token
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Credentials'
            responses:
              '201':
                description: Signed in.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Session'
              '401':
                $ref: '#/components/responses/Problem'
        /wallets:
          get:
            operationId: listWallets
            summary: List the customer's wallets and balances
            responses:
              '200':
                description: One wallet per currency.
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/Wallet'
        /quotes:
          post:
            operationId: createQuote
            summary: Get an exchange quote, valid for a short time
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QuoteRequest'
            responses:
              '201':
                description: The quote and when it expires.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Quote'
        /top-ups:
          post:
            operationId: startTopUp
            summary: Add money to a wallet from a card
            description: >-
              Returns as soon as the card charge is requested. The final result arrives later
              through the provider's callback; the top-up stays pending until then.
            parameters:
              - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TopUpRequest'
            responses:
              '202':
                description: Accepted; the top-up is pending.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MoneyMovement'
              '422':
                $ref: '#/components/responses/Problem'
        /transfers:
          post:
            operationId: startTransfer
            summary: Send money to another wallet, optionally converting the currency
            parameters:
              - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/TransferRequest'
            responses:
              '201':
                description: The transfer was completed.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MoneyMovement'
              '422':
                $ref: '#/components/responses/Problem'
        /transfers/{movementId}:
          get:
            operationId: getMoneyMovement
            summary: Read the status of a top-up, transfer or refund
            parameters:
              - name: movementId
                in: path
                required: true
                schema:
                  type: string
            responses:
              '200':
                description: The money movement.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MoneyMovement'
        /provider-callbacks/payments:
          post:
            operationId: receivePaymentResult
            summary: Callback used by the payment provider
            description: >-
              The provider may call several minutes after the charge, and may send the same
              result more than once. Results are identified by eventId and applied only once.
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaymentResult'
            responses:
              '204':
                description: Recorded, or ignored because it was already processed.
      components:
        parameters:
          IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            description: Repeating a request with the same key returns the original result.
            schema:
              type: string
        responses:
          Problem:
            description: The request could not be processed.
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/Problem'
        schemas:
          Money:
            type: object
            required: [amount, currency]
            properties:
              amount:
                type: string
                description: Decimal amount, for example "12.50".
                pattern: '^-?[0-9]+(\.[0-9]+)?$'
              currency:
                type: string
                description: ISO 4217 currency code.
                pattern: '^[A-Z]{3}$'
          Credentials:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
          Session:
            type: object
            required: [accessToken, expiresAt]
            properties:
              accessToken:
                type: string
              expiresAt:
                type: string
                format: date-time
          Wallet:
            type: object
            required: [walletId, available, reserved]
            properties:
              walletId:
                type: string
              available:
                $ref: '#/components/schemas/Money'
              reserved:
                $ref: '#/components/schemas/Money'
          QuoteRequest:
            type: object
            required: [sell, buyCurrency]
            properties:
              sell:
                $ref: '#/components/schemas/Money'
              buyCurrency:
                type: string
                pattern: '^[A-Z]{3}$'
          Quote:
            type: object
            required: [quoteId, sell, buy, rate, expiresAt]
            properties:
              quoteId:
                type: string
              sell:
                $ref: '#/components/schemas/Money'
              buy:
                $ref: '#/components/schemas/Money'
              rate:
                type: string
              expiresAt:
                type: string
                format: date-time
          TopUpRequest:
            type: object
            required: [walletId, amount, cardToken]
            properties:
              walletId:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
              cardToken:
                type: string
                description: A token from the provider's card form; card numbers never reach the wallet.
          TransferRequest:
            type: object
            required: [fromWalletId, toWalletId, amount]
            properties:
              fromWalletId:
                type: string
              toWalletId:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
              quoteId:
                type: string
                description: Required when the wallets have different currencies.
          MoneyMovement:
            type: object
            required: [movementId, kind, status, amount]
            properties:
              movementId:
                type: string
              kind:
                type: string
                enum: [top-up, transfer, refund]
              status:
                type: string
                enum: [pending, completed, rejected, failed, refunded]
              amount:
                $ref: '#/components/schemas/Money'
              rejectionReason:
                type: string
          PaymentResult:
            type: object
            required: [eventId, providerReference, outcome]
            properties:
              eventId:
                type: string
                description: Unique per result; duplicates carry the same value.
              providerReference:
                type: string
              outcome:
                type: string
                enum: [approved, declined]
          Problem:
            type: object
            required: [type, title]
            properties:
              type:
                type: string
              title:
                type: string
              detail:
                type: string
  - id: transfer-api
