      components:
        schemas:
          Quote:
            type: object
            required: [quoteId, rate, expiresAt]
            properties:
              quoteId:
                type: string
              rate:
                type: string
              expiresAt:
                type: string
                format: date-time
  - id: provider-api
    name: Payment provider API (simulated)
    format: openapi
    formatVersion: 3.1.0
    documentVersion: 5.0.0
    mediaType: application/yaml
    sourceId: provider-integration-guide
    content: |
      openapi: 3.1.0
      info:
        title: Payment provider API (simulated)
        version: 5.0.0
        description: >-
          The fictional payment provider's API as the wallet uses it. The same API serves the
          sandbox used in staging. Results are reported later through a callback.
      paths:
        /charges:
          post:
            operationId: createCharge
            summary: Charge a card
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ChargeRequest'
            responses:
              '202':
                description: Accepted; the result follows by callback.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Accepted'
        /refunds:
          post:
            operationId: createRefund
            summary: Refund all or part of an earlier charge
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RefundRequest'
            responses:
              '202':
                description: Accepted; the result follows by callback.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Accepted'
      components:
        schemas:
          ChargeRequest:
            type: object
            required: [cardToken, amount, currency, merchantReference]
            properties:
              cardToken:
                type: string
              amount:
                type: string
              currency:
                type: string
              merchantReference:
                type: string
                description: The wallet's movement ID; settlement files repeat it.
          RefundRequest:
            type: object
            required: [providerReference, amount, currency]
            properties:
              providerReference:
                type: string
              amount:
                type: string
              currency:
                type: string
          Accepted:
            type: object
            required: [providerReference]
            properties:
              providerReference:
                type: string
  - id: ledger-api
    name: Ledger service API
    format: openapi
    formatVersion: 3.1.0
    documentVersion: 3.1.0
    mediaType: application/yaml
    sourceId: ledger-head
    content: |
      openapi: 3.1.0
      info:
        title: Ledger service API
        version: 3.1.0
        description: Used by the reconciliation job to book corrections. Fictional; part of the DomainMap demo.
      paths:
        /corrections:
          post:
            operationId: bookCorrection
            summary: Book a correcting journal entry
            description: Rejected unless the postings of the entry add up to zero per currency.
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Correction'
            responses:
              '201':
                description: Booked.
              '422':
                description: The postings are not balanced.
      components:
        schemas:
          Correction:
            type: object
            required: [reason, postings]
            properties:
              reason:
                type: string
              settlementLine:
                type: string
              postings:
                type: array
                minItems: 2
                items:
                  $ref: '#/components/schemas/Posting'
          Posting:
            type: object
            required: [account, side, amount, currency]
            properties:
              account:
                type: string
              side:
                type: string
                enum: [debit, credit]
              amount:
                type: string
              currency:
                type: string
  - id: transfer-events-asyncapi
    name: Transfer events
    format: asyncapi
    formatVersion: 3.0.0
    documentVersion: 1.3.0
    mediaType: application/yaml
    sourceId: wallet-platform-head
    content: |
      asyncapi: 3.0.0
      info:
        title: Transfer events
        version: 1.3.0
        description: >-
          Status changes of top-ups, transfers and refunds, published to a topic. Consumers must
          expect duplicates and use eventId to ignore them. Fictional; part of the DomainMap demo.
      channels:
        transferStatus:
          address: transfer-status-topic
          messages:
            transferStatusChanged:
              $ref: '#/components/messages/transferStatusChanged'
      operations:
        publishTransferStatus:
          action: send
          channel:
            $ref: '#/channels/transferStatus'
          messages:
            - $ref: '#/channels/transferStatus/messages/transferStatusChanged'
        receiveTransferStatus:
          action: receive
          channel:
            $ref: '#/channels/transferStatus'
          messages:
            - $ref: '#/channels/transferStatus/messages/transferStatusChanged'
      components:
        messages:
          transferStatusChanged:
            summary: A money movement reached a new status.
            headers:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
            payload:
              type: object
              required: [movementId, kind, status, occurredAt]
              properties:
                movementId:
                  type: string
                kind:
                  type: string
                  enum: [top-up, transfer, refund]
                status:
                  type: string
                  enum: [pending, completed, rejected, failed, refunded]
                occurredAt:
                  type: string
                  format: date-time
  - id: ledger-postings-asyncapi
    name: Ledger postings
    format: asyncapi
    formatVersion: 3.0.0
    documentVersion: 2.0.0
    mediaType: application/yaml
    sourceId: ledger-head
    content: |
      asyncapi: 3.0.0
      info:
        title: Ledger postings
        version: 2.0.0
        description: >-
          Posting requests from the cloud services to the ledger in the data center. Every request
          is one journal entry whose postings add up to zero per currency. The ledger books each
          idempotency key once, so redelivered messages are harmless. Fictional; part of the
          DomainMap demo.
      channels:
        ledgerPostings:
          address: ledger.postings.v1
          messages:
            postingRequested:
              $ref: '#/components/messages/postingRequested'
      operations:
        sendPostingRequests:
          action: send
          channel:
            $ref: '#/channels/ledgerPostings'
          messages:
            - $ref: '#/channels/ledgerPostings/messages/postingRequested'
        receivePostingRequests:
          action: receive
          channel:
            $ref: '#/channels/ledgerPostings'
          messages:
            - $ref: '#/channels/ledgerPostings/messages/postingRequested'
      components:
        schemas:
          Posting:
            type: object
            required: [account, side, amount, currency]
            properties:
              account:
                type: string
              side:
                type: string
                enum: [debit, credit]
              amount:
                type: string
                description: Positive decimal amount.
              currency:
                type: string
        messages:
          postingRequested:
            summary: Book one balanced journal entry.
            payload:
              type: object
              required: [entryId, idempotencyKey, movementId, postings]
              properties:
                entryId:
                  type: string
                idempotencyKey:
                  type: string
                movementId:
                  type: string
                postings:
                  type: array
                  minItems: 2
                  items:
                    $ref: '#/components/schemas/Posting'
            examples:
              - name: top-up
                summary: A card top-up of 50.00 EUR was approved.
                payload:
                  entryId: je-0001
                  idempotencyKey: top-up-mv-1001
                  movementId: mv-1001
                  postings:
                    - { account: provider-clearing-eur, side: debit, amount: '50.00', currency: EUR }
                    - { account: wallet-w-2001-eur, side: credit, amount: '50.00', currency: EUR }
              - name: transfer-with-conversion
                summary: 100.00 EUR sent to a USD wallet at a rate of 1.0850.
                payload:
                  entryId: je-0002
                  idempotencyKey: transfer-mv-1002
                  movementId: mv-1002
                  postings:
                    - { account: wallet-w-2001-eur, side: debit, amount: '100.00', currency: EUR }
                    - { account: fx-position-eur, side: credit, amount: '100.00', currency: EUR }
                    - { account: fx-position-usd, side: debit, amount: '108.50', currency: USD }
                    - { account: wallet-w-2002-usd, side: credit, amount: '108.50', currency: USD }
              - name: refund
                summary: 20.00 EUR of the top-up was refunded to the card.
                payload:
                  entryId: je-0003
                  idempotencyKey: refund-mv-1003
                  movementId: mv-1003
                  postings:
                    - { account: wallet-w-2001-eur, side: debit, amount: '20.00', currency: EUR }
                    - { account: provider-clearing-eur, side: credit, amount: '20.00', currency: EUR }
  - id: settlement-file
    name: Settlement file format
    format: markdown
    mediaType: text/markdown
    sourceId: provider-integration-guide
    content: |
      # Settlement file format (fictional)

      The payment provider publishes one file per day on its SFTP server, named
      `settlement-YYYY-MM-DD.csv`. Each line is one charge or refund that the provider settled.

      | Column               | Meaning                                           |
      | -------------------- | ------------------------------------------------- |
      | `provider_reference` | The provider's ID of the charge or refund         |
      | `merchant_reference` | The wallet's movement ID, as sent with the charge |
      | `type`               | `charge` or `refund`                              |
      | `amount`             | Decimal amount                                    |
      | `currency`           | ISO 4217 currency code                            |
      | `settled_at`         | Date and time of settlement, in UTC               |

      A line can appear one day after the payment itself, so the reconciliation job keeps
      unmatched journal entries open for three days before it reports them.
