  - id: wallet-funds-grpc
    name: Wallet funds API (gRPC)
    format: protobuf
    documentVersion: v1
    mediaType: text/plain
    sourceId: wallet-platform-head
    content: |
      // Fictional; part of the DomainMap demo.
      syntax = "proto3";

      package wallet.funds.v1;

      // Used by the transfer service to move money in and out of wallets.
      service WalletFunds {
        // Moves an amount from the available to the reserved balance.
        rpc ReserveFunds(ReserveFundsRequest) returns (Reservation);
        // Applies a balance change exactly once per idempotency key.
        rpc ApplyBalanceChange(BalanceChange) returns (BalanceChangeResult);
        // Returns reserved money to the available balance.
        rpc ReleaseFunds(ReleaseFundsRequest) returns (Reservation);
      }

      message Money {
        string amount = 1;
        string currency = 2;
      }

      message ReserveFundsRequest {
        string wallet_id = 1;
        Money amount = 2;
        string idempotency_key = 3;
      }

      message Reservation {
        string reservation_id = 1;
        Money reserved = 2;
      }

      message BalanceChange {
        string wallet_id = 1;
        Money delta = 2;
        string idempotency_key = 3;
        string reservation_id = 4;
      }

      message BalanceChangeResult {
        Money available = 1;
        bool already_applied = 2;
      }

      message ReleaseFundsRequest {
        string reservation_id = 1;
      }
  - id: fx-api
